# Keeps the public feeds live. GitHub delays or drops cron triggers on young repos
# (a */10 schedule fired once in two hours; the hourly one stopped for hours), so
# each run keeps the relay loop alive for 57 minutes and then dispatches the next
# run itself. Cron and the health workflow only restart the chain if it breaks.
# The transmitter is untrusted by design: it only relays reporter signatures.
name: relay
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to dispatch the next run

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: reporter
      - name: relay loop (57 min, a round check every 2 min)
        working-directory: reporter
        run: timeout 57m npx tsx src/cli.ts run || [ $? -eq 124 ]
        env:
          KURS_CHAINS: ${{ vars.KURS_CHAINS || 'portaldot,sepolia' }}
          KURS_INTERVAL_SECONDS: "120"
          DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          REPORTER_1_PK: ${{ secrets.REPORTER_1_PK }}
          REPORTER_2_PK: ${{ secrets.REPORTER_2_PK }}
          REPORTER_3_PK: ${{ secrets.REPORTER_3_PK }}
          REPORTER_4_PK: ${{ secrets.REPORTER_4_PK }}
          REPORTER_5_PK: ${{ secrets.REPORTER_5_PK }}
      - name: chain the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # the concurrency group holds it until this run ends; extra pending runs are dropped
        run: gh workflow run relay.yml --ref main
