name: halmos
# Symbolic proofs of the median (contracts/test/KursHalmos.t.sol): run when the oracle
# or the proofs change, and weekly.
on:
  push:
    branches: [main]
    paths: ["contracts/src/KursOracle.sol", "contracts/test/KursHalmos.t.sol", ".github/workflows/halmos.yml"]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

concurrency:
  group: halmos
  cancel-in-progress: true

jobs:
  prove:
    # one job per proof: a slow proof cannot hide the others' results
    strategy:
      fail-fast: false
      matrix:
        check: [sort3, sort4, sort5, medianBounded3, medianBounded4, medianBounded5, minority3, minority4, minority5]
    name: prove ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.0 # pinned: .gas-snapshot depends on the gas schedule of this version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install halmos==0.3.3
      - run: halmos --match-contract KursHalmos --function check_${{ matrix.check }} --loop 6 --solver-timeout-assertion 0
        working-directory: contracts
