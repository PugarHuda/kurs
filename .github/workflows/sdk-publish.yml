name: sdk-publish
# Publishes sdk/ (npm "kurs-oracle") with npm provenance: the package page links the exact
# commit and workflow run that built it. Uses npm trusted publishing (OIDC), no token:
# configure once on npmjs.com -> kurs-oracle -> Settings -> Trusted publisher ->
# GitHub Actions, repo PugarHuda/kurs, workflow sdk-publish.yml. Run by pushing a tag sdk-v*.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm publish --provenance --access public
