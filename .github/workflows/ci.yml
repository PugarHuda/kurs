name: ci
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.0 # pinned: .gas-snapshot depends on the gas schedule of this version
      - run: forge test -vv
        working-directory: contracts
      # gas regressions: deterministic tests only (fuzz/invariant gas varies by seed)
      - run: forge snapshot --check --no-match-test 'Fuzz|fuzz|invariant'
        working-directory: contracts

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.0 # pinned: .gas-snapshot depends on the gas schedule of this version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      # triage of every excluded detector: docs/security.md
      - run: slither . --fail-medium
        working-directory: contracts

  reporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1 # anvil for the e2e test
        with:
          version: v1.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npx tsc --noEmit && npm test
        working-directory: reporter

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix ../reporter && npm ci && npm run build
        working-directory: web

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix ../reporter && npm ci && npx playwright install --with-deps chromium
        working-directory: web
      # the API tests call the deployed functions: wait until Vercel serves this commit
      # (push builds there in parallel with CI); pull requests test against what is live
      - name: wait for the Vercel deployment of this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 60); do
            c=$(curl -s -m 20 "https://kurs-ten-zeta.vercel.app/api/feeds?ci=$i" | jq -r .commit 2>/dev/null || true)
            [ "$c" = "$GITHUB_SHA" ] && echo "deployed: $c" && exit 0
            sleep 10
          done
          echo "production did not reach $GITHUB_SHA in 10 min; testing what is live" >&2
      - run: npx playwright test
        working-directory: web

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # builds the npm package and checks it against the live contracts and API
      - run: npm ci && npm run build && npm test
        working-directory: sdk
