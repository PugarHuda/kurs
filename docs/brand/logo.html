<!doctype html>
<html>
<head>
<style>
@font-face { font-family: "DSEG7"; src: url("../../web/public/DSEG7Classic-Bold.woff2") format("woff2"); }
html, body { margin: 0; background: transparent; }
.logo {
  width: 480px; height: 480px; border-radius: 64px;
  background: #13233a; box-shadow: inset 0 0 0 22px #1b2f4c;
  display: grid; place-items: center; position: relative; overflow: hidden;
  font-family: "Archivo", "Arial Black", sans-serif;
}
.word { font-family: "DSEG7"; font-size: 150px; color: #ffb000; text-shadow: 0 0 26px rgba(255,176,0,.55); letter-spacing: .02em; }
.rate { position: absolute; bottom: 64px; left: 0; right: 0; text-align: center; font-family: "DSEG7"; font-size: 34px; color: #5c7392; letter-spacing: .1em; }
.dots { position: absolute; top: 62px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; }
.dots i { width: 22px; height: 22px; border-radius: 50%; background: #ffb000; box-shadow: 0 0 10px rgba(255,176,0,.8); }
.dots i.off { background: #2a3d5a; box-shadow: none; }
</style>
</head>
<body>
  <div class="logo" id="logo">
    <div class="dots"><i></i><i></i><i></i><i></i><i class="off"></i></div>
    <div class="word">KUrS</div>
    <div class="rate">18152.70</div>
  </div>
</body>
</html>
