[package]
name = "kurs_consumer"
version = "0.1.0"
authors = ["Pugar Huda Mantoro <hudapugar@gmail.com>"]
edition = "2024"

[dependencies]
ink = { version = "6.0.0-beta.1", default-features = false, features = ["unstable-hostfn"] }

[dev-dependencies]
ink_e2e = { version = "6.0.0-beta.1" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
]
ink-as-dependency = []
e2e-tests = []

[package.metadata.ink-lang]
abi = "ink"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(ink_abi, values("ink", "sol", "all"))'
]

# pallet-revive charges a deposit per byte of code: optimise for size
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
